prompt:
  title: "DESIGN.md rewrite prompt — {site}"
  how_to: "How to use this file: open Claude Code or claude.ai, attach the screenshots listed below, then paste this whole file as your message. get-design-markdown itself never calls an AI API — any rewrite happens in your own Claude session."
  ai_heading: "Instructions for the AI"
  ai_intro: "You are given a rule-built DESIGN.md (Google Labs DESIGN.md format, version alpha) that was measured from {url}, plus screenshots of the same page."
  rule_prose: "Rewrite only the prose so it reads naturally and describes the visual style well. Write the prose in {language}."
  rule_values: "Never change numbers, hex values, token names, `{{group.token}}` references, the YAML front matter, table values or the order and titles of the `##` sections."
  rule_screens: "Use the screenshots only to describe style, mood and layout; never take measurements from them and never add tokens or values that are not already in the document."
  rule_contrast: "Keep every Don't about failing contrast pairs, with its measured ratio; never describe those pairs as easy to read."
  rule_output: "Return the complete DESIGN.md only, starting with the `---` front matter line."
  images_heading: "Screenshots"
  image_desktop: "desktop capture (light theme, top of the page, resized)"
  image_mobile: "mobile capture (light theme, top of the page, resized)"
  no_images: "No screenshot was available; describe the style from the data only."
  summary_heading: "Measured data (summary)"
  summary_colors: "Colors"
  summary_type: "Type levels"
  summary_rounded: "Radius"
  summary_spacing: "Spacing"
  summary_failing: "Pairs below WCAG AA"
  summary_dark: "dark theme"
  summary_breakpoints: "Breakpoints"
  summary_none: "none"
  draft_heading: "DESIGN.md (rule-based draft)"
  language: "English"
