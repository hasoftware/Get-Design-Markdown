name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  exe:
    name: Windows exe
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check that the tag matches the project version
        id: version
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} không khớp version ${version} trong pyproject.toml (cần v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (locked, gui + build)
        run: uv sync --locked --extra gui --group build
      # No Playwright Chromium on purpose: like on a user's PC, the exe must find the
      # preinstalled Microsoft Edge by itself.
      - name: Build the exe
        run: uv run --locked --extra gui --group build python scripts/build_exe.py --zip
      - name: Self-test of the exe
        # The exe is a windowed app: without -Wait it returns at once, and its exit code is
        # only known through -PassThru. The step timeout guards against a hanging exe.
        timeout-minutes: 10
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # The windowed exe writes ui.log there (its stdout/stderr): kept as an artifact.
          $env:GDM_UI_LOG_DIR = Join-Path (Get-Location) 'exe-logs'
          $report = Join-Path (Get-Location) 'self-test.json'
          $p = Start-Process -FilePath 'dist\Get-Design-Markdown\Get-Design-Markdown.exe' -ArgumentList '--self-test','--self-test-report',"`"$report`"" -Wait -PassThru
          $log = Join-Path $env:GDM_UI_LOG_DIR 'ui.log'
          if (-not (Test-Path $report)) {
            if (Test-Path $log) { Get-Content -Encoding utf8 -Tail 60 $log }
            Write-Output "::error::Bản exe không ghi báo cáo tự kiểm tra $report (mã thoát $($p.ExitCode))."
            exit 1
          }
          Get-Content -Encoding utf8 $report
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content -Encoding utf8 -Tail 60 $log }
            Write-Output "::error::Bài tự kiểm tra của bản exe thất bại (mã thoát $($p.ExitCode))."
            exit 1
          }
      - name: Check the zip name
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="dist/Get-Design-Markdown-${VERSION}-windows-x64.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::Không tìm thấy $zip (tên file phải theo version ${VERSION})."
            ls -l dist
            exit 1
          fi
      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-exe
          path: dist/Get-Design-Markdown-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-exe-self-test
          path: |
            self-test.json
            exe-logs/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: [ci, exe]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check that the tag matches the project version
        id: version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} không khớp version ${version} trong pyproject.toml (cần v${version})."
            exit 1
          fi
          package_version=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/get_design_markdown/__init__.py)
          if [ "${package_version}" != "${version}" ]; then
            echo "::error::__version__ = ${package_version} khác version ${version} trong pyproject.toml."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and sdist
        run: uv build
      - name: Download the Windows exe
        uses: actions/download-artifact@v8
        with:
          name: release-windows-exe
          path: exe
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          exe_zip="exe/Get-Design-Markdown-${VERSION}-windows-x64.zip"
          if [ ! -f "$exe_zip" ]; then
            echo "::error::Thiếu bản exe $exe_zip."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "$exe_zip" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
