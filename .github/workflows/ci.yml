name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # Official DESIGN.md linter, pinned so a new release cannot change CI on its own. Bump it by
  # hand together with tests/test_synthesizer_linter.py.
  DESIGN_MD_LINTER: "@google/design.md@0.4.0"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (src, tests)
        run: uv run mypy src tests
      - name: Mypy (scripts)
        run: uv run mypy scripts

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      GDM_REQUIRE_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: uv run playwright install chromium
      - name: Pytest
        run: uv run pytest -ra --junitxml=pytest-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-${{ matrix.os }}-${{ matrix.python }}.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end (fixture site)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDM_REQUIRE_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Pytest e2e
        run: uv run pytest -m e2e -ra
      - name: Pipeline on the fixture site + verify_output
        id: pipeline
        run: uv run python scripts/run_e2e.py --out e2e-output
      - name: Set up Node
        if: steps.pipeline.outputs.design_md != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Official DESIGN.md linter
        if: steps.pipeline.outputs.design_md != ''
        env:
          DESIGN_MD: ${{ steps.pipeline.outputs.design_md }}
        # The package's other bin is literally named design.md, which Windows resolves as
        # a Markdown file; designmd works on every OS.
        run: npx --yes --package "$DESIGN_MD_LINTER" designmd lint "$DESIGN_MD"
      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: e2e-output
          if-no-files-found: ignore

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build
      - name: Check wheel contents
        # Every non-Python file of the package is loaded at runtime (collector/js/*.js,
        # synthesizer/phrases/*.yaml, templates/*.j2) and so is every file of the UI's
        # ui/static/ folder, whatever its suffix: list them from git, never by hand.
        run: |
          uv run --no-project python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          git ls-files -- 'src/get_design_markdown/*.js' 'src/get_design_markdown/*.yaml' \
            'src/get_design_markdown/*.j2' 'src/get_design_markdown/*.html' \
            'src/get_design_markdown/*.css' 'src/get_design_markdown/*.svg' \
            'src/get_design_markdown/*.png' 'src/get_design_markdown/*.ico' \
            'src/get_design_markdown/ui/static/' \
            | sed 's|^src/||' | sort -u > resources.txt
          if [ ! -s resources.txt ]; then
            echo "::error::Không tìm thấy file tài nguyên nào trong src/get_design_markdown."
            exit 1
          fi
          if ! grep -qx 'get_design_markdown/ui/static/index.html' resources.txt; then
            echo "::error::Không tìm thấy giao diện get_design_markdown/ui/static/index.html."
            exit 1
          fi
          missing=0
          while IFS= read -r member; do
            if ! grep -qF "$member" wheel-contents.txt; then
              echo "::error::Wheel thiếu $member"
              missing=1
            fi
          done < resources.txt
          exit "$missing"
      - name: Check sdist contents
        # The sdist holds only files tracked by git (pyproject.toml lists the paths), never
        # untracked local files such as output/ or notes kept next to the checkout.
        run: |
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | grep -v -e '/$' -e '^$' | sort > sdist-contents.txt
          git ls-files | sort > tracked.txt
          untracked=$(comm -23 sdist-contents.txt tracked.txt | grep -vx 'PKG-INFO' || true)
          if [ -n "$untracked" ]; then
            echo "::error::Sdist chứa file không được git theo dõi: $untracked"
            exit 1
          fi
      - name: Twine check
        run: uvx twine check --strict dist/*
      - name: Smoke test the wheel
        run: |
          uv venv --python 3.12 wheel-env
          uv pip install --python wheel-env/bin/python dist/*.whl
          wheel-env/bin/gdm --version
          wheel-env/bin/gdm ui --help
          wheel-env/bin/gdm-ui --help
          # Read every packaged resource through the runtime API of the installed wheel
          # (text files as UTF-8, images as bytes), including the UI's start page.
          wheel-env/bin/python - <<'EOF'
          from pathlib import Path

          import get_design_markdown
          from get_design_markdown.resources import resource_path, resource_text

          assert "wheel-env" in Path(get_design_markdown.__file__).parts, get_design_markdown.__file__
          binary = {".png", ".ico"}
          members = Path("resources.txt").read_text(encoding="utf-8").split()
          for line in members:
              parts = line.split("/")[1:]
              assert resource_path(*parts).read_bytes(), line
              if Path(line).suffix not in binary:
                  resource_text(*parts)
          index = resource_path("ui", "static", "index.html").read_text(encoding="utf-8")
          assert "<html" in index.lower(), "ui/static/index.html"
          print(f"Đọc được {len(members)} file tài nguyên từ wheel đã cài.")
          EOF
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  exe:
    name: Windows exe
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (locked, gui + build)
        run: uv sync --locked --extra gui --group build
      # No Playwright Chromium on purpose: like on a user's PC, the exe must find the
      # preinstalled Microsoft Edge by itself.
      - name: Build the exe
        run: uv run --locked --extra gui --group build python scripts/build_exe.py --zip
      - name: Self-test of the exe
        # The exe is a windowed app: without -Wait it returns at once, and its exit code is
        # only known through -PassThru. The step timeout guards against a hanging exe.
        timeout-minutes: 10
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # The windowed exe writes ui.log there (its stdout/stderr): kept as an artifact.
          $env:GDM_UI_LOG_DIR = Join-Path (Get-Location) 'exe-logs'
          $report = Join-Path (Get-Location) 'self-test.json'
          $p = Start-Process -FilePath 'dist\Get-Design-Markdown\Get-Design-Markdown.exe' -ArgumentList '--self-test','--self-test-report',"`"$report`"" -Wait -PassThru
          $log = Join-Path $env:GDM_UI_LOG_DIR 'ui.log'
          if (-not (Test-Path $report)) {
            if (Test-Path $log) { Get-Content -Encoding utf8 -Tail 60 $log }
            Write-Output "::error::Bản exe không ghi báo cáo tự kiểm tra $report (mã thoát $($p.ExitCode))."
            exit 1
          }
          Get-Content -Encoding utf8 $report
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content -Encoding utf8 -Tail 60 $log }
            Write-Output "::error::Bài tự kiểm tra của bản exe thất bại (mã thoát $($p.ExitCode))."
            exit 1
          }
      - name: Upload the exe
        # A single zip, uploaded as is (archive: false): the artifact is the file users get.
        uses: actions/upload-artifact@v7
        with:
          path: dist/Get-Design-Markdown-*-windows-x64.zip
          archive: false
          if-no-files-found: error
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exe-self-test
          path: |
            self-test.json
            exe-logs/
          if-no-files-found: ignore
