name: CI

on:
  push:
    branches:
      - main
      - "stream/**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # Official DESIGN.md linter, pinned so a new release cannot change CI on its own. Bump it by
  # hand together with tests/test_synthesizer_linter.py (dependabot does not track npx).
  DESIGN_MD_LINTER: "@google/design.md@0.4.0"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (src, tests)
        run: uv run mypy src tests
      - name: Mypy (scripts)
        run: uv run mypy scripts

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      GDM_REQUIRE_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: uv run playwright install chromium
      - name: Pytest
        run: uv run pytest -ra --junitxml=pytest-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-${{ matrix.os }}-${{ matrix.python }}.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end (fixture site)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDM_REQUIRE_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Pytest e2e
        run: uv run pytest -m e2e -ra
      - name: Pipeline on the fixture site + verify_output
        id: pipeline
        run: uv run python scripts/run_e2e.py --out e2e-output
      - name: Set up Node
        if: steps.pipeline.outputs.design_md != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Official DESIGN.md linter
        if: steps.pipeline.outputs.design_md != ''
        env:
          DESIGN_MD: ${{ steps.pipeline.outputs.design_md }}
        # The package's other bin is literally named design.md, which Windows resolves as
        # a Markdown file; designmd works on every OS.
        run: npx --yes --package "$DESIGN_MD_LINTER" designmd lint "$DESIGN_MD"
      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output
          if-no-files-found: ignore

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build
      - name: Check wheel contents
        # Every non-Python file of the package is loaded at runtime (collector/js/*.js,
        # synthesizer/phrases/*.yaml, templates/*.j2): list them from git, never by hand.
        run: |
          uv run --no-project python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          git ls-files -- 'src/get_design_markdown/*.js' 'src/get_design_markdown/*.yaml' \
            'src/get_design_markdown/*.j2' | sed 's|^src/||' > resources.txt
          if [ ! -s resources.txt ]; then
            echo "::error::Không tìm thấy file tài nguyên nào trong src/get_design_markdown."
            exit 1
          fi
          missing=0
          while IFS= read -r member; do
            if ! grep -qF "$member" wheel-contents.txt; then
              echo "::error::Wheel thiếu $member"
              missing=1
            fi
          done < resources.txt
          exit "$missing"
      - name: Twine check
        run: uvx twine check --strict dist/*
      - name: Smoke test the wheel
        run: |
          uv venv --python 3.12 wheel-env
          uv pip install --python wheel-env/bin/python dist/*.whl
          wheel-env/bin/gdm --version
          # Read every packaged resource through the runtime API of the installed wheel.
          wheel-env/bin/python -c "from get_design_markdown.resources import resource_text; [resource_text(*line.split('/')[1:]) for line in open('resources.txt').read().split()]"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
