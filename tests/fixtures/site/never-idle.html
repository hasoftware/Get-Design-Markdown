<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live status — Acme Cloud</title>
    <meta name="description" content="A page that never becomes network-idle." />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // theme.css is loaded from the *other* host name of the fixture server so that it is
      // a cross-origin stylesheet (cssRules unreadable from scripts).
      (function () {
        var host = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = location.protocol + "//" + host + ":" + location.port + "/theme.css";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-inner">
        <a class="logo" href="/">Acme</a>
        <nav class="main-nav" aria-label="Main">

          <a class="btn btn-primary btn-sm" href="/signup.html">Get started</a>
          <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <h1 class="hero-title">Live status</h1>
          <p class="lead">This page polls the server every 300 ms and never becomes network-idle.</p>
        </div>
      </section>
    </main>
    <script>
      setInterval(function () {
        fetch("/ping.txt?t=" + Date.now(), { cache: "no-store" });
      }, 300);
    </script>
